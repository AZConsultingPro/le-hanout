left:3.5cqw;right:3.5cqw;font-size:1.02cqw;line-height:1.35;color:var(--teal)}.ref strong{display:block;font-size:1.15cqw}.footer{position:absolute;bottom:1.35cqw;left:3.5cqw;right:3.5cqw;display:flex;justify-content:space-between;font-size:.95cqw;color:#52696a}.progress{height:.35cqw;background:var(--orange);position:absolute;bottom:0;left:0;transition:width .4s}.route .items{grid-template-columns:1fr 1fr;gap:1.2cqw}.route .item{font-size:1.55cqw;background:#fff;padding:.8cqw;border-radius:.5cqw}.toolbar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;color:#fff;font-size:13px}.toolbar button,.toolbar select{border:1px solid #ffffff35;background:#26474a;color:white;border-radius:7px;padding:9px 12px}.toolbar button:hover{background:#386164}.toolbar button:disabled{opacity:.35;cursor:default}.toolbar .primary{background:#ffcf61;color:#173f43;border-color:#ffcf61;font-weight:bold}.notes{position:fixed;inset:8% 12%;background:var(--cream);z-index:5;padding:32px;box-shadow:0 0 0 100vmax #001c;overflow:auto;border-radius:12px}.notes[hidden]{display:none}.notes pre{white-space:pre-wrap;font:16px/1.6 Arial;color:var(--ink)}.notes button{float:right;padding:10px}.help{color:#b9cecd;font-size:11px}.enter{animation:enter .65s both}.item{animation:enter .6s both;animation-delay:calc(var(--i)*.09s + .15s)}.out{animation:enter .6s .65s both}.float{animation:float 2.5s ease-in-out 2 alternate}.pop{transform-box:fill-box;transform-origin:center;animation:pop .8s both;animation-delay:.3s}.deliver{animation:deliver 1.4s ease-out both}.draw{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.8s .5s forwards}.wave{transform-box:fill-box;transform-origin:15% 80%;animation:wave 1s .5s 2 alternate}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.1s .4s both}.still *{animation:none!important;stroke-dashoffset:0!important}.still .bar{transform:none!important}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes float{to{transform:translateY(-7px)}}@keyframes pop{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}@keyframes deliver{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes wave{to{transform:rotate(-10deg)}}@keyframes grow{from{transform:scaleY(.1)}to{transform:scaleY(1)}}.wide .main{grid-template-columns:1fr;height:31.2cqw;align-items:start}.wide .art{display:none}.wide .copy{padding-right:0}.wide .items{display:grid;grid-template-columns:repeat(3,1fr);gap:.8cqw}.wide .item{background:#fff;border:1px solid #d8e5df;border-radius:.65cqw;padding:.72cqw .8cqw;font-size:1.12cqw;line-height:1.22;min-height:6.2cqw}.wide .item strong{font-size:1.25cqw;color:var(--teal)}.wide .item small{font-size:1.02cqw;line-height:1.25;margin-top:.28cqw}.wide .number{flex-basis:1.8cqw;width:1.8cqw;height:1.8cqw;font-size:1cqw}.wide .out{font-size:1.18cqw;margin-top:.9cqw;padding:.8cqw 1cqw}.wide .ref{font-size:.92cqw}.wide .ref strong{font-size:1.02cqw}

<aside id="workshops" hidden class="notes workshop" role="dialog" aria-modal="true" aria-label="Fiches et prompts"><button id="closeWorkshop">Revenir au diaporama ×</button><h2>Fiches des cinq équipes</h2><div id="workshopTabs"></div><div id="workshopContent"></div></aside><script>
const slides=[{"title": "Bienvenue : Hanout passe à l’action", "sub": "Mardi 6 octobre 2026 · Cinq équipes, cinq premières productions", "items": ["Le nom Hanout est validé. Vos équipes sont constituées.", "Aujourd’hui : observer, préparer, produire et vérifier."], "out": "Notre objectif : une première production expliquée, pas un travail parfait.", "scene": "team", "time": 2, "tag": "0–2 MIN · LANCEMENT", "ref": "", "comp": "", "notes": "Séance de 60 minutes. Les équipes sont confirmées : pas de vote ni de nouvelle constitution. Présenter le résultat minimum de chaque équipe et annoncer les restitutions. Avant le cours : préparer les accès scolaires, deux tableurs vierges, le lot de marchandises autorisé, papier et feutres. Si les outils ne sont pas accessibles, les productions papier sont acceptées. Les fiches et prompts sont intégrés au bouton « Fiches et prompts » ; elles se consultent pendant les créneaux de travail et ne rajoutent pas du temps à la séance."}, {"title": "Retrouvez votre équipe", "sub": "Installez-vous et ouvrez la fiche portant votre numéro.", "items": ["Achats et approvisionnement|Benissa · Ilyana · Assiya", "Point de vente et merchandising|Adam · Islam · Lionel", "Vente et relation client|Titli · Farel · Mustapha", "Communication et image|Chaïma · Jana · Issam", "Gestion et développement|Ibrahim · Selmene · Maxime"], "out": "Chacun lit, contribue et vérifie. Une personne ne fait pas tout le travail.", "scene": "roles", "time": 3, "tag": "2–5 MIN · INSTALLATION", "ref": "", "comp": "", "notes": "15 élèves, cinq trios confirmés. Faire identifier le numéro de groupe et le support à remettre. Chaïma peut coordonner son groupe, en veillant à la contribution de Jana et Issam. Ne pas attribuer tous les échanges oraux à un même élève. Prévoir la rotation des rôles. Les observations pédagogiques individuelles ne sont pas affichées dans ce support."}, {"title": "Commencez sans attendre", "sub": "Lisez votre fiche. La première action se fait sur papier.", "items": ["Inventaire : préparez les colonnes du tableau.", "Stand : répondez aux questions sur le lieu et le matériel.", "Enquête : chacun propose un besoin et un produit possible.", "Logo : choisissez une valeur, un symbole et des couleurs.", "Budget : proposez une répartition des 800 €."], "out": "Information inconnue ? Écrivez « à vérifier ». Ne la remplacez pas par une supposition.", "scene": "work", "time": 7, "tag": "5–12 MIN · DÉMARRAGE", "ref": "", "comp": "", "notes": "A.Zeboudj lance l’enquête clients avec Titli, Farel et Mustapha. Mme Miri désigne le lot de marchandises accessible et montre une première ligne d’inventaire. Le groupe inventaire prépare les colonnes sans manipuler un stock non désigné. Stand et communication remplissent leur brief ; gestion esquisse les catégories de dépenses. Cliquer sur « Fiches et prompts » pour afficher une mission, puis fermer le panneau pour retrouver le déroulé. Les élèves peuvent travailler sur leur fiche papier ou consulter ce même fichier sur leur poste."}, {"title": "Observez, comptez, questionnez", "sub": "Votre première version doit s’appuyer sur des informations réelles.", "items": ["Inventaire : comptez les unités et recopiez les mentions de date.", "Stand et logo : complétez le brief, puis faites un croquis.", "Enquête : rédigez cinq questions neutres.", "Budget : vérifiez le total et comparez les pistes de mobilier."], "out": "Avant l’IA : vos observations, vos choix et vos questions doivent être écrits.", "scene": "skills", "time": 13, "tag": "12–25 MIN · PREMIÈRE PRODUCTION", "ref": "", "comp": "", "notes": "12–20 : A.Zeboudj accompagne l’enquête ; Mme Miri accompagne le stand et ses observations. 20–25 : A.Zeboudj lance le calcul budgétaire avec gestion ; Mme Miri valide le brief du stand. Pendant ce temps, l’équipe enquête relit ses formulations et alterne les prises de parole. Le stock avance sur le lot validé ; communication prépare une piste papier. Pour l’inventaire : cinq lignes contrôlées suffisent ou tout le lot si moins de cinq lignes. Séparer les lots de dates différentes, compter en unités de vente et signaler les anomalies à l’adulte. Personne ne décide seul de vendre ou d’écarter un produit."}, {"title": "Un point avec votre enseignant", "sub": "Montrez ce que vous avez déjà fait, même si ce n’est pas terminé.", "items": ["Voici notre production et ce que nous avons vérifié.", "Voici notre difficulté ou notre information manquante.", "Notre prochaine action sera…"], "out": "À corriger : un seul point précis à la fois. Continuez votre fiche pendant l’attente.", "scene": "interview", "time": 5, "tag": "25–30 MIN · CONTRÔLE", "ref": "", "comp": "", "notes": "A.Zeboudj relit les questions de l’enquête et lance un test. Mme Miri contrôle deux lignes d’inventaire et accompagne la saisie. Stand : poursuivre le croquis et signaler les inconnues. Communication : finaliser le brief avant son passage de 30 à 35. Gestion : contrôler le total et comparer réemploi, prêt/don, occasion et neuf. Relances communes : qu’avez-vous compris ? Montrez votre travail. Que reste-t-il à vérifier ? Qui fait quoi maintenant ? Donner une seule correction immédiatement réalisable par groupe."}, {"title": "Utilisez les outils pour avancer", "sub": "Après vérification avec un adulte, mettez au propre votre travail.", "items": ["Inventaire et budget : saisissez dans le tableur et vérifiez.", "Stand et logo : utilisez votre brief pour demander une proposition à l’IA.", "Enquête : testez vos questions ; Google Forms si vous êtes prêts."], "out": "Gardez le contrôle : un résultat d’IA peut être faux. Conservez le prompt et notez les corrections.", "scene": "idea", "time": 13, "tag": "30–43 MIN · OUTILS ET VÉRIFICATION", "ref": "", "comp": "", "notes": "30–35 : A.Zeboudj accompagne le test du questionnaire ou sa saisie ; Mme Miri relit le brief communication. 35–43 : A.Zeboudj contrôle les formules de gestion, puis revient à l’enquête ; Mme Miri critique le visuel du stand, puis revient à l’inventaire. Les fiches contiennent les trois prompts. Les accès et fonctions Canva/IA doivent être vérifiés avant le cours ; ne pas promettre une fonction indisponible. Sans génération : croquis justifié. Sans connexion : tableau ou questionnaire papier. Pas de données personnelles dans les prompts, pas de diffusion du questionnaire ni de publication sur les réseaux aujourd’hui. Les futurs comptes seront organisés avec les adultes. L’image du stand n’est ni un plan à l’échelle ni une validation d’aménagement."}, {"title": "Enregistrez et préparez votre compte rendu", "sub": "Une page, un tableau, un croquis ou une capture commentée suffit.", "items": ["Nommez et enregistrez le document dans le dossier indiqué.", "Choisissez un résultat à montrer et une raison à expliquer.", "Notez une vérification à faire ou une correction nécessaire."], "out": "À remettre : votre première production, même incomplète, avec le numéro de l’équipe.", "scene": "portfolio", "time": 5, "tag": "43–48 MIN · PRÉPARER LA RESTITUTION", "ref": "", "comp": "", "notes": "Seuils : inventaire, cinq lignes contrôlées ; stand, brief + croquis/image et une critique ; enquête, cinq questions et une correction issue du test ; logo, brief + une piste justifiée ; gestion, répartition de 800 € et un calcul expliqué. Un document papier reste recevable. Vérifier que les fichiers sont réellement accessibles aux enseignants, et pas seulement visibles à l’écran. Aucun PowerPoint à créer pendant cette heure. Rappeler qu’un prix, une mesure et une disponibilité doivent être vérifiés à une source ; ne pas les déduire d’une réponse IA."}, {"title": "Partageons nos résultats", "sub": "Deux minutes par équipe, dans l’ordre des numéros.", "items": ["Montrez votre production.", "Expliquez un choix ou un contrôle réalisé.", "Dites ce qui reste à vérifier et votre prochaine action."], "out": "Écoutez les autres : leur résultat peut aider votre équipe.", "scene": "celebrate", "time": 10, "tag": "48–58 MIN · RESTITUTION", "ref": "", "comp": "", "notes": "Cinq équipes × deux minutes : 90 secondes de présentation et 30 secondes de retour. Inventaire aide le budget ; enquête prépare le choix des produits ; stand et logo préparent l’espace commercial. Noter au tableau une action et un responsable par groupe, avec une échéance réelle à annoncer. Ne pas valider les achats ou l’offre définitive à partir de brouillons. Gestion : pour l’exercice fictif, 20 × 0,60 = 12 € d’achat ; 20 × 1 = 20 € de recettes si tout est vendu ; différence = 8 € avant autres frais, pas bénéfice net. Si seulement 55 minutes sont disponibles, réduire ce créneau à cinq minutes, puis conserver deux minutes pour le bilan."}, {"title": "Merci pour votre implication et la qualité de votre travail", "sub": "Chacun garde une trace personnelle de sa contribution.", "items": ["J’ai fait…", "J’ai vérifié…", "Il reste à…"], "out": "Prochain rendez-vous : date, heure et salle annoncées par vos enseignants.", "scene": "portfolio", "time": 2, "tag": "58–60 MIN · BILAN", "ref": "", "comp": "", "notes": "Faire écrire nom, équipe et trois phrases précises. Distinguer l’action du groupe de la contribution individuelle. Évaluer la lisibilité, le respect de la consigne, la participation et la capacité à expliquer, sans assimiler cette trace à une validation complète de compétence. Récupérer les productions. Prochain rendez-vous à annoncer réellement. Seuil de réussite de séance : chaque groupe a produit une première trace exploitable et chaque élève peut expliquer une action."}];
const ink='#173f43',teal='#13877e',gold='#ffcf61',orange='#e77958',mint='#dcefe7';
const rect=(x,y,w,h,c,r=6)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${c}"/>`;
const line=(x,y,a,b,c=ink,w=5)=>`<path d="M${x} ${y}L${a} ${b}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
const text=(x,y,s,size=20,c=ink)=>`<text x="${x}" y="${y}" font-family="Arial,sans-serif" font-size="${size}" font-weight="700" fill="${c}">${s}</text>`;
const circ=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
function person(x,y,scale=1,color=teal,skin='#b87851',style=0){return `<g transform="translate(${x} ${y}) scale(${scale})">${style===1?`<path d="M-27 37Q-42 -28 0 -28Q44 -25 29 40" fill="#382c28"/>`:''}${line(-13,125,-18,185,ink,17)}${line(13,125,24,185,ink,17)}${line(-24,190,-9,190,ink,12)}${line(19,190,36,190,ink,12)}<path d="M-28 44Q0 30 28 44L35 125H-35Z" fill="${color}"/>${line(-25,54,-43,102,color,15)}<g class="wave">${line(24,55,47,81,color,15)}${line(47,81,64,60,skin,11)}</g>${circ(-43,109,7,skin)}${rect(-9,22,18,24,skin)}${circ(0,5,26,skin)}<path d="M-25 0Q-30 -28 2 -25Q27 -24 26 0Q7 -6 2 -15Q-9 1 -25 0" fill="#382c28"/>${circ(-9,6,2,ink)}${circ(9,6,2,ink)}<path d="M-6 18Q0 22 7 17" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round"/>${style===2?`<path d="M-25 44L-8 38L0 65L9 38L27 44L22 122H-24Z" fill="${ink}"/><path d="M-8 38L0 65L9 38" fill="white"/>`:''}</g>`}
function box(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})" class="deliver">${rect(0,0,86,69,'#d7a46c',2)}${rect(35,0,16,69,'#efd1a3',0)}${line(4,5,81,5,'#b98350',2)}${text(8,51,'↑ ↑',19)}</g>`}
function sheet(x,y,s=1,check=true){return `<g transform="translate(${x} ${y}) scale(${s})" class="pop">${rect(0,0,130,160,'#fff',9)}${rect(35,-8,60,20,gold)}${[40,75,110].map(v=>`${rect(15,v,17,17,mint,3)}${line(45,v+8,110,v+8,'#aec7c0',5)}${check?`<path class="draw" d="M18 ${v+9}l5 5 12 -15" fill="none" stroke="${teal}" stroke-width="4"/>`:''}`).join('')}</g>`}
function bubble(x,y,label='?',c=gold){return `<g class="pop">${rect(x,y,92,64,c,20)}<path d="M${x+22} ${y+58}l-7 22 30 -20" fill="${c}"/>${text(x+32,y+43,label,36)}</g>`}
function bottle(x,y,c=teal){return `<g class="pop">${rect(x+9,y,18,12,ink,2)}${rect(x+5,y+9,26,49,c,7)}${rect(x+6,y+27,24,18,'#fff',1)}</g>`}
function shelf(){return `${rect(65,95,272,230,'#b0c6bb',4)}${rect(77,102,248,211,'#f2ecdb',2)}${[170,245,316].map(y=>rect(66,y,272,10,ink,2)).join('')}${bottle(100,110)}${bottle(145,110,orange)}${bottle(193,110)}${box(96,194,.58)}${box(162,194,.58)}${rect(254,144,55,25,gold,3)}${text(263,162,'€',19)}${rect(254,219,55,25,gold,3)}${text(263,237,'€',19)}`}
function shop(){return `${rect(54,115,292,224,'#fff',8)}${rect(68,159,120,108,mint,3)}${rect(207,159,122,108,mint,3)}${rect(78,178,99,9,teal,2)}${bottle(89,193)}${bottle(135,193,orange)}${rect(53,74,294,52,teal,8)}${text(89,109,'NOTRE COMMERCE',22,'#fff')}${[0,1,2,3,4,5].map(i=>rect(54+i*49,124,49,32,i%2?gold:'#fff',3)).join('')}${rect(67,278,267,62,'#dab58c',4)}${rect(218,239,65,39,ink,4)}${rect(225,245,51,23,mint,3)}${line(235,278,275,278,ink,7)}`}
function scene(kind){let inner='',label='';
if(kind==='shop'){inner=shop()+person(75,195,.75,orange,'#cd936d',1)+person(317,189,.78,teal,'#805239',0);label='Des élèves préparent le commerce du lycée';}
if(kind==='team'||kind==='roles'||kind==='celebrate'){inner=person(80,150,.95,orange,'#d79c76',1)+person(200,126,1.08,teal,'#805239',0)+person(315,155,.93,gold,'#c58a60',2);if(kind==='roles')inner+=bubble(38,44,'1')+bubble(154,20,'2',mint)+bubble(275,46,'3');else inner+=bubble(155,30,kind==='celebrate'?'✓':'!',gold);label='Une équipe de trois personnes en tenue ordinaire';}

let index=0,animate=!matchMedia('(prefers-reduced-motion: reduce)').matches;const stage=document.getElementById('stage');const jump=document.getElementById('jump');const notes=document.getElementById('notes');const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${String(i+1).padStart(2,'0')} · ${s.title}`;jump.append(o)});
function render(){const s=slides[index];stage.className='stage '+(animate?'':'still ')+(s.items.length>3?'dense ':'')+(s.scene==='route'?'route ':'')+(s.wide?'wide ':'');stage.innerHTML=`<header><span>${s.tag} · 2EPC</span><span class="time">${s.time} min</span></header><h1 class="enter">${s.title}</h1><p class="sub enter">${s.sub}</p><div class="main"><div class="copy"><div class="items">${s.items.map((v,i)=>{let parts=v.split('|');return `<div class="item" style="--i:${i}"><span class="number">${i+1}</span><div>${parts.length>1?`<strong>${parts[0]}</strong><small>${parts[1]}</small>`:v}</div></div>`}).join('')}</div><div class="out">${s.out}</div></div><div class="art">${scene(s.scene)}</div></div>${s.ref?`<div class="ref"><strong>${s.ref}</strong>${s.comp}</div>`:''}<div class="footer"><span>Projet Hanout · Mme A.Miri et A.Zeboudj</span><span>${String(index+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span></div><div class="progress" style="width:${(index+1)/slides.length*100}%"></div>`;jump.value=index;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;document.getElementById('noteText').textContent=s.notes;document.getElementById('motion').textContent='Animations : '+(animate?'oui':'non');document.getElementById('motion').setAttribute('aria-pressed',animate);}
function go(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));notes.hidden=true;render();}document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);jump.onchange=()=>{index=Number(jump.value);notes.hidden=true;render()};document.getElementById('replay').onclick=render;document.getElementById('motion').onclick=()=>{animate=!animate;render()};async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('full').textContent='Utilisez F11';}}document.getElementById('full').onclick=fullscreen;document.getElementById('teacher').onclick=()=>{document.getElementById('workshops').hidden=true;notes.hidden=!notes.hidden};document.getElementById('close').onclick=()=>{notes.hidden=true};document.addEventListener('keydown',e=>{if(e.key==='Escape'){notes.hidden=true;document.getElementById('workshops').hidden=true;return}if(!document.getElementById('workshops').hidden||!notes.hidden||['SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='f')fullscreen()});render();

const handouts=["<div class=\"tag\">Équipe 1 · Achats et approvisionnement</div><h2>Benissa · Ilyana · Assiya</h2><p class=\"goal\"><strong>Votre mission :</strong> savoir précisément ce que nous possédons déjà. À remettre : un inventaire de cinq lignes vérifiées dans un tableur, ou sur papier si l’accès ne fonctionne pas.</p><h3>1. Commencez sans attendre · 5–12 min</h3><p>Écrivez les titres du tableau ci-dessous. Une personne compte, une relève les étiquettes, une écrit. Attendez l’adulte pour désigner le lot à inventorier et réaliser la première ligne ensemble.</p><h3>2. Observez et comptez · 12–25 min</h3><ol><li>Lisez le nom exact et le format du produit.</li><li>Comptez les <strong>unités qui pourront être vendues</strong>, pas seulement les cartons.</li><li>Recopiez la date et la mention qui l’accompagne sur l’emballage.</li><li>Faites une ligne différente si le même produit porte une autre date.</li><li>Notez les anomalies visibles ou les informations illisibles, puis demandez l’avis d’un adulte.</li></ol>\n<table><tr><th>Produit + format</th><th>Quantité en unités de vente</th><th>Mention de date relevée</th><th>Date relevée</th><th>État / à vérifier</th><th>Emplacement</th></tr><tr><td colspan=\"6\">Modèle à reproduire dans le tableur ; ne saisissez que vos observations réelles.</td></tr></table>\n<h3>3. Faites contrôler puis saisissez · 25–43 min</h3><p>Montrez deux lignes à Mme Miri. Après correction, saisissez vos cinq lignes. Changez les rôles. Le vérificateur relit chaque quantité et chaque date face au produit. Si aucune date n’apparaît, écrivez « non indiquée » ; ne complétez pas au hasard.</p><div class=\"box\"><strong>Premiers gestes dans le tableur :</strong> renommez le fichier ; placez les titres sur la ligne 1 ; un produit/lot par ligne ; une information par cellule ; élargissez les colonnes. Pour conserver la mention et la date exactement comme lues, saisissez-les comme du texte si nécessaire. Les quantités restent des nombres.</div><h3>4. Préparez votre compte rendu · 43–48 min</h3><p>« Nous avons vérifié … lignes. Nous avons trouvé … . Il faut encore vérifier … . » Enregistrez le fichier dans l’emplacement indiqué par l’enseignant.</p><p class=\"small\"><strong>Pour réussir :</strong> noms précis, comptage contrôlé, dates non inventées, anomalies signalées. Cette première tâche prépare le suivi du stock ; elle ne nécessite pas d’IA.</p><p class=\"small\"><strong>CAP EPC :</strong> Bloc 1 · Recevoir et suivre les commandes : surveiller l’état des stocks. Bloc 2 · Mettre en valeur et approvisionner : ranger et compter les produits. Travail préparatoire, compétences à observer en situation.</p><div class=\"footer\">Hanout · Mme A.Miri et A.Zeboudj · Fiche élève 1/5</div>", "<div class=\"tag\">Équipe 2 · Point de vente et merchandising</div><h2>Adam · Islam · Lionel</h2><p class=\"goal\"><strong>Votre mission :</strong> décrire un stand possible, puis utiliser cette description pour faire un croquis ou demander une image à l’IA. L’image doit respecter vos informations.</p><h3>1. Répondez ensemble · 5–20 min</h3><p>Adam lit les questions, Islam note, Lionel vérifie ce que vous savez réellement. Changez les rôles après la visite de l’adulte. Si vous ne savez pas, écrivez <strong>« à vérifier »</strong>.</p><table><tr><th>Questions pour préparer le stand</th><th>Réponse / à vérifier</th></tr><tr><td>1. Où le stand pourrait-il se trouver ? Le lieu est-il confirmé ?</td><td></td></tr><tr><td>2. Quelle largeur et quelle profondeur sont disponibles ? Mesurées ou estimées ?</td><td></td></tr><tr><td>3. Quelle table, étagère ou armoire existe déjà ?</td><td></td></tr><tr><td>4. Quels produits pourrait-on exposer ? Quels éléments restent à confirmer ?</td><td></td></tr><tr><td>5. Où ranger la marchandise et le matériel après la vente ?</td><td></td></tr><tr><td>6. Où passent les clients et où peuvent-ils attendre sans gêner ?</td><td></td></tr><tr><td>7. Existe-t-il une prise à proximité ? Pour quel appareil serait-elle utile ?</td><td></td></tr><tr><td>8. Où placer le nom Hanout, les prix et la caisse ?</td><td></td></tr></table>\n<h3>2. Faites valider votre description · 20–25 min</h3><p>Montrez le questionnaire et un petit plan à Mme Miri. Ne déplacez pas le mobilier et ne branchez aucun appareil pour ce travail d’observation.</p><h3>3. Préparez le prompt · 25–43 min</h3><button class=\"copy\" data-copy=\"standPrompt\">Copier le prompt</button><pre id=\"standPrompt\">Nous préparons Hanout, un petit commerce pédagogique dans un lycée. Voici notre brief : [coller nos réponses sans les prénoms]. Distingue les faits vérifiés des inconnues. N’invente aucune mesure ni prise électrique. S’il manque une information indispensable, pose au maximum trois questions courtes, puis attends nos réponses. Ensuite, propose un stand simple utilisant d’abord le mobilier existant, avec des prix lisibles, une zone de rangement et un passage dégagé. Si tu peux générer une image, illustre cette proposition ; sinon, décris-la pour que nous la dessinions. Toute hypothèse doit être signalée comme une hypothèse. Pas de personnages nécessaires.</pre><h3>4. Vérifiez et montrez · 43–48 min</h3><p>Conservez une image ou votre croquis. Écrivez : <strong>deux éléments respectés</strong> et <strong>un élément à corriger ou à vérifier</strong>. Une belle image n’est ni un plan à l’échelle ni une autorisation d’aménagement.</p><p class=\"small\"><strong>CAP EPC :</strong> Bloc 2 · Mettre en valeur et approvisionner : mettre en valeur les produits et l’espace commercial ; installer et mettre à jour la signalétique. Préparation à l’aménagement réel.</p><div class=\"footer\">Hanout · Mme A.Miri et A.Zeboudj · Fiche élève 2/5</div>", "<div class=\"tag\">Équipe 3 · Vente et relation client</div><h2>Titli · Farel · Mustapha</h2><p class=\"goal\"><strong>Votre mission :</strong> préparer cinq questions pour comprendre les besoins des lycéens. À remettre : le questionnaire et une correction issue de votre test.</p><h3>1. Commencez par les besoins · 5–12 min</h3><p>Chacun propose un besoin et un produit possible. Complétez : « Un lycéen pourrait avoir besoin de … parce que … ». Gardez trois hypothèses à explorer ; ce ne sont pas encore des produits choisis.</p><h3>2. Écrivez cinq questions avec A.Zeboudj · 12–25 min</h3><table><tr><th>Ce que vous voulez savoir</th><th>Votre question</th></tr><tr><td>Un besoin concret au lycée</td><td></td></tr><tr><td>Les produits recherchés</td><td></td></tr><tr><td>Le produit prioritaire</td><td></td></tr><tr><td>Le prix acceptable pour un produit et un format précis</td><td></td></tr><tr><td>Une suggestion libre</td><td></td></tr></table><p>Prévoyez au moins deux questions ouvertes. Évitez « Vous aimez…, non ? ». Pour le prix, précisez de quel produit et de quel format vous parlez. Ne demandez ni nom, ni téléphone, ni adresse électronique.</p><h3>3. Testez, écoutez, corrigez · 25–35 min</h3><p>Avec l’accord de l’enseignant, posez vos questions à deux camarades. Une personne questionne, une note, une observe ; changez après le premier test. Ne coupez pas la réponse. Reformulez : « Si j’ai bien compris… ». Notez une question mal comprise et réécrivez-la.</p><h3>4. Mettez au propre · 35–43 min</h3><p>Si le questionnaire est prêt et l’accès disponible, créez Google Forms avec l’adulte : un titre, une phrase sur l’objectif, cinq questions. Vérifiez l’absence de collecte d’adresse électronique. Faites un essai en aperçu. <strong>La diffusion générale aux lycéens vient après validation.</strong> Sinon, remettez une version papier lisible.</p><div class=\"box\"><strong>Votre compte rendu :</strong> « Nous cherchons à savoir… Notre test a montré… Nous avons corrigé… ». Deux tests servent à améliorer les questions, pas à décider de l’offre du lycée.</div><p class=\"small\"><strong>Pour réussir :</strong> questions neutres, réponse écoutée, prix lié à un produit précis, correction expliquée. Chacun pose une question et sait présenter une partie du travail.</p><p class=\"small\"><strong>CAP EPC :</strong> Bloc 3 · Conseiller et accompagner le client dans son parcours d’achat : adopter une écoute active. L’enquête prépare la découverte des besoins ; le dialogue de vente viendra ensuite.</p><div class=\"footer\">Hanout · Mme A.Miri et A.Zeboudj · Fiche élève 3/5</div>", "<div class=\"tag\">Équipe 4 · Communication et image</div><h2>Chaïma · Jana · Issam</h2><p class=\"goal\"><strong>Votre mission :</strong> préparer une piste de logo Hanout que vous savez expliquer. Pas de création de compte public ni de publication aujourd’hui.</p><h3>1. Construisez votre brief · 5–20 min</h3><p>Chaïma coordonne et fait participer chacun. Jana prépare une piste de symbole ; Issam propose des couleurs ou une façon d’écrire Hanout. Comparez vos idées avant de choisir.</p><table><tr><th>Questions pour l’IA ou votre croquis</th><th>Votre réponse</th></tr><tr><td>Que propose Hanout et à qui s’adresse-t-il ?</td><td></td></tr><tr><td>Quelle valeur doit-on comprendre : accueil, entraide, simplicité… ?</td><td></td></tr><tr><td>Quels deux mots décrivent le style souhaité ?</td><td></td></tr><tr><td>Quelles une ou deux couleurs choisissez-vous ? Pourquoi ?</td><td></td></tr><tr><td>Quel symbole simple pourrait représenter le commerce ?</td><td></td></tr><tr><td>Où verra-t-on le logo : affiche, étiquette, futur compte du projet… ?</td><td></td></tr></table>\n<h3>2. Faites un brouillon avant l’IA · 20–30 min</h3><p>Écrivez le mot Hanout et dessinez une piste. Vérifiez que le nom se lit facilement. Préparez une justification : « Nous avons choisi… parce que… ».</p><h3>3. Demandez une proposition · 30–43 min</h3><p>Après lecture du brief par Mme Miri, utilisez l’outil accessible et autorisé. Si l’outil ne génère pas d’image, utilisez ses conseils pour améliorer votre croquis.</p><button class=\"copy\" data-copy=\"logoPrompt\">Copier le prompt</button><pre id=\"logoPrompt\">Nous créons l’identité de Hanout, un commerce pédagogique dans un lycée. Le nom Hanout est validé et doit être écrit exactement ainsi. Voici notre brief : [coller nos réponses, sans les prénoms]. Propose une piste de logo simple et lisible en petit, avec une ou deux couleurs, utilisable aussi en noir et blanc. Évite les détails inutiles, les marques existantes et les signes religieux. Explique en trois phrases le lien entre le symbole, les couleurs et notre projet. Si tu ne peux pas produire d’image, donne une description facile à dessiner. Ne prétends pas garantir l’originalité juridique du résultat.</pre><h3>4. Contrôlez la proposition · 43–48 min</h3><p>Cochez : □ « Hanout » bien écrit □ lisible en petit □ lien avec notre valeur □ utilisable sans couleur. Conservez le prompt et une image ou un croquis. Préparez deux phrases de justification.</p><p class=\"small\"><strong>Si vous avez terminé :</strong> proposez une accroche « Hanout se prépare… », sans date d’ouverture non confirmée. La gestion des futurs réseaux sera organisée avec les adultes dans une autre étape.</p><p class=\"small\"><strong>CAP EPC :</strong> Bloc 2 · Mettre en valeur et approvisionner : mettre en valeur les produits et l’espace commercial ; préparer la future signalétique. La création du logo est une activité de projet, pas une compétence autonome du référentiel.</p><div class=\"footer\">Hanout · Mme A.Miri et A.Zeboudj · Fiche élève 4/5</div>", "<div class=\"tag\">Équipe 5 · Gestion et développement</div><h2>Ibrahim · Selmene · Maxime</h2><p class=\"goal\"><strong>Votre mission :</strong> proposer une utilisation des 800 € et expliquer un calcul simple. Votre budget est provisoire, aucun achat n’est engagé.</p><h3>1. Répartissez l’enveloppe · 5–20 min</h3><p>Ibrahim propose les besoins, Selmene réalise les calculs, Maxime vérifie le total et les informations manquantes. Chacun explique un choix ; échangez les rôles pour le deuxième calcul.</p><table><tr><th>Catégorie (colonne A)</th><th>Montant proposé en € (B)</th><th>Pourquoi ? (C)</th></tr><tr><td>2 · Marchandises à compléter</td><td></td><td>Tenir compte du stock déjà présent.</td></tr><tr><td>3 · Mobilier et matériel</td><td></td><td>Vérifier d’abord ce qui peut être réutilisé.</td></tr><tr><td>4 · Communication</td><td></td><td></td></tr><tr><td>5 · Réserve non dépensée</td><td></td><td>Pour les besoins non encore connus.</td></tr><tr><td>6 · Total réparti</td><td>=B2+B3+B4+B5</td><td>Doit être égal à 800 €.</td></tr><tr><td>7 · Écart à corriger</td><td>=800-B6</td><td>Doit être égal à 0 €.</td></tr></table>\n<h3>2. Cherchez des pistes pour le mobilier · 20–30 min</h3><p>Avec l’adulte, comparez : réemploi dans le lycée, prêt ou don, occasion, achat neuf. Notez pour deux pistes : avantage, coût à vérifier, transport et état à contrôler.</p><button class=\"copy\" data-copy=\"budgetPrompt\">Copier le prompt</button><pre id=\"budgetPrompt\">Nous préparons Hanout, un commerce pédagogique de lycée. Nous disposons de 800 € pour compléter la marchandise, obtenir éventuellement du mobilier et du matériel, et conserver une réserve. Une partie du stock existe déjà mais son inventaire est en cours. Compare en quatre lignes : réemploi interne, prêt ou don, occasion, achat neuf. Indique pour chaque piste un avantage et deux points à vérifier. Ne donne pas de faux prix, de faux fournisseurs ni de fausses disponibilités. Termine par trois questions à poser à notre enseignant. Ne décide pas de nos achats à notre place.</pre>\n<h3>3. Réalisez un calcul · 30–43 min</h3><p><strong>Exercice fictif, pas un prix de marché :</strong> 20 produits, prix d’achat unitaire 0,60 €, prix de vente envisagé 1 €.</p><p>Coût d’achat = quantité × prix d’achat : …… €<br>Recettes si tout est vendu = quantité × prix de vente : …… €<br>Écart avant autres frais = recettes − coût d’achat : …… €</p><p class=\"small\">Cet écart n’est pas le bénéfice net : il reste les autres frais, les pertes et les éventuels invendus. Pour une offre réelle, relevez source, date, quantité du lot, prix total et frais de livraison ; calculez ensuite le prix unitaire. Ne mélangez pas prix d’un lot et prix d’une unité.</p><h3>4. Préparez votre restitution · 43–48 min</h3><p>Montrez le total de 800 €, justifiez une dépense et une réserve. Présentez votre calcul et une information manquante. Si vous avancez vite, vérifiez une offre réelle de mobilier sur une source accessible, sans acheter.</p><p class=\"small\"><strong>CAP EPC :</strong> préparation des propositions de commandes (Bloc 1), savoirs de calcul commercial et travail transversal sur le budget. L’exercice ne valide pas à lui seul un bloc professionnel.</p><div class=\"footer\">Hanout · Mme A.Miri et A.Zeboudj · Fiche élève 5/5</div>"];
const workshop=document.getElementById('workshops');let currentGroup=0;
function showGroup(i){currentGroup=i;document.getElementById('workshopTabs').innerHTML=handouts.map((_,j)=>`<button data-group="${j}" aria-pressed="${j===i}">Équipe ${j+1}</button>`).join('');document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>showGroup(Number(b.dataset.group)));document.getElementById('workshopContent').innerHTML=handouts[i];document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const t=document.getElementById(b.dataset.copy);try{await navigator.clipboard.writeText(t.textContent);b.textContent='Copié';}catch{const r=document.createRange();r.selectNodeContents(t);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent='Texte sélectionné : copiez-le';}});}
document.getElementById('workshop').onclick=()=>{notes.hidden=true;showGroup(currentGroup);workshop.hidden=false;document.getElementById('closeWorkshop').focus();};document.getElementById('closeWorkshop').onclick=()=>{workshop.hidden=true;document.getElementById('workshop').focus();};
</script></body></html>
